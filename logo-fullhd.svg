<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="AILE logo full HD">
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap');
  ]]></style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d10"/>
      <stop offset="55%" stop-color="#10161b"/>
      <stop offset="100%" stop-color="#0b1014"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0.18" cy="0.2" r="0.4">
      <stop offset="0%" stop-color="#3AAB74" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3AAB74" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0.82" cy="0.75" r="0.45">
      <stop offset="0%" stop-color="#E7FF00" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#E7FF00" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glowLeft)"/>
  <rect width="1920" height="1080" fill="url(#glowRight)"/>

  <g transform="translate(960 540)">
    <g fill="#f3f7fa" font-family="Montserrat, Segoe UI, Arial, sans-serif" font-size="290" font-weight="700" text-anchor="middle" dominant-baseline="central" letter-spacing="8">
      <text x="-225" y="20">Ʌ</text>
      <text x="-65" y="20">I</text>
      <text x="65" y="20">L</text>
      <text x="225" y="20">E</text>
    </g>

    <circle cx="-71" cy="-144" r="25" fill="#3AAB74" filter="url(#softGlow)"/>

    <text x="0" y="250" fill="#d7e0e5" opacity="0.82" font-family="Segoe UI, Arial, sans-serif" font-size="56" letter-spacing="14" text-anchor="middle">ROBOTICS</text>
  </g>
</svg>
