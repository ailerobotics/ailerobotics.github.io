<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - AILE Robotics</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">Ʌ<span class="logo-i">I</span>LE</div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="connect.html" class="nav-link">Connect</a></li>
                <li><a href="jobs.html" class="nav-link">Careers</a></li>
                <li><a href="contact.html" class="nav-link active">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Page Header -->
    <section class="page-header">
        <h1>Contact Us</h1>
        <p>We'd love to hear from you. Get in touch with our team.</p>
    </section>

    <!-- Contact Section -->
    <section class="contact-section">
        <div class="container">
            <div class="contact-wrapper">
                <!-- Contact Information -->
                <div class="contact-info">
                    <h2>Get in Touch</h2>
                    <div class="info-item">
                        <h3>Follow Us</h3>
                        <div class="social-links">
                            <a href="https://www.linkedin.com/company/ailerobotics/" target="_blank" class="social-link">LinkedIn</a>
                        </div>
                    </div>
                </div>

                <!-- Contact Form -->
                <form class="contact-form" onsubmit="handleContactSubmit(event)">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Send Message</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 AILE Robotics. All rights reserved.</p>
            <ul class="footer-links">
                <li><a href="contact.html">Contact</a></li>
                <li><a href="connect.html">Connect</a></li>
                <li><a href="jobs.html">Careers</a></li>
            </ul>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
